<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="Seller Dashboard - TopTop BD" data-bn="সেলার ড্যাশবোর্ড - TopTop BD">সেলার ড্যাশবোর্ড - TopTop BD</title>
    
    <!-- FontAwesome আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #ff5722;
            --primary-gradient: linear-gradient(135deg, #ff5722 0%, #ff8a50 100%);
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --radius: 14px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* প্রিমিয়াম হেডার */
        header {
            background: var(--primary-gradient);
            color: white;
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(255, 87, 34, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-top {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-top h1 a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .logout-btn:hover {
            background: #fff;
            color: #d32f2f;
            border-color: #fff;
        }

        /* মূল ড্যাশবোর্ড কন্টেইনার */
        .dashboard-container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 15px;
        }

        /* সেলার ইনফো প্রোফাইল কার্ড */
        .profile-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            gap: 20px;
        }
        .profile-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 5px;
            background: var(--primary-gradient);
        }
        .profile-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .seller-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffd8cc;
            box-shadow: 0 4px 10px rgba(255, 87, 34, 0.15);
            background: #fff3ed;
        }
        .profile-info h3 {
            margin: 0 0 6px 0;
            color: var(--text-main);
            font-size: 20px;
            font-weight: 700;
        }
        .profile-info p {
            margin: 3px 0;
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .coin-badge {
            background: #fff3ed;
            color: #ff5722;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid #ffd8cc;
            box-shadow: 0 4px 10px rgba(255, 87, 34, 0.1);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .profile-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .coin-badge {
                align-self: flex-start;
            }
        }

        /* কুইক অ্যাকশন মেনু গ্রিড */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        @media (max-width: 768px) {
            .action-grid {
                grid-template-columns: 1fr;
            }
        }
        .action-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .action-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 8px 25px rgba(255, 87, 34, 0.15);
        }
        .action-card i {
            font-size: 28px;
            color: var(--primary);
            background: #fff3ed;
            padding: 15px;
            border-radius: 50%;
        }
        .action-card h4 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
        }
        .action-card p {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .card-box {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #f7fafc;
            padding-bottom: 10px;
        }
        .section-title i {
            color: var(--primary);
        }

        /* আমার পণ্যের লিস্ট ডিজাইন */
        #myProductsList {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .prod-info-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .prod-thumb {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #cbd5e0;
        }
        .prod-details h4 {
            margin: 0 0 3px 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }
        .prod-details span {
            font-size: 12px;
            color: var(--primary);
            font-weight: 700;
        }
        .delete-btn {
            background: #fff5f5;
            color: #e53e3e;
            border: 1px solid #fed7d7;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .delete-btn:hover {
            background: #e53e3e;
            color: white;
        }
        .empty-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 30px 0;
        }
    </style>
</head>
<body>

    <!-- হেডার -->
    <header>
        <div class="header-top">
            <h1><a href="index.html">TopTop BD <span style="font-size: 12px; font-weight: 400; opacity: 0.8;">| Seller Dashboard</span></a></h1>
            <button class="logout-btn" onclick="logoutSeller()"><i class="fa-solid fa-right-from-bracket"></i> <span data-en="Logout" data-bn="লগআউট">লগআউট</span></button>
        </div>
    </header>

    <!-- মূল ড্যাশবোর্ড কন্টেইনার -->
    <div class="dashboard-container">
        
        <!-- সেলার ইনফো কার্ড -->
        <div class="profile-card">
            <div class="profile-left">
                <!-- সেলারের ছবি দেখানোর ট্যাগ -->
                <img id="sellerImgDisplay" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="seller-avatar" alt="Seller Image" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
                
                <div class="profile-info">
                    <h3 id="shopNameDisplay">দোকানের নাম</h3>
                    <p><i class="fa-solid fa-id-badge" style="color: #ff5722;"></i> <strong>সেলার আইডি:</strong> <span id="sellerIdDisplay">-</span></p>
                    <p><i class="fa-solid fa-user-tie" style="color: #ff5722;"></i> <span id="ownerNameDisplay">মালিক: -</span></p>
                    <p><i class="fa-solid fa-location-dot" style="color: #ff5722;"></i> <span id="locationDisplay">এলাকা: -</span></p>
                </div>
            </div>
            <div>
                <div class="coin-badge">
                    <i class="fa-solid fa-coins" style="color: #f6ad55;"></i> 
                    <span><span id="coinCount">0</span> কয়েন</span>
                </div>
            </div>
        </div>

        <!-- কুইক অ্যাকশন মেনু গ্রিড -->
        <div class="action-grid">
            <a href="upload_product.html" class="action-card">
                <i class="fa-solid fa-circle-plus"></i>
                <div>
                    <h4>পণ্য আপলোড</h4>
                    <p>নতুন পণ্য যোগ করুন (১ কয়েন)</p>
                </div>
            </a>

            <a href="coin_recharge.html" class="action-card">
                <i class="fa-solid fa-wallet"></i>
                <div>
                    <h4>কয়েন রিচার্জ</h4>
                    <p>ওয়ালেটে কয়েন যোগ করুন</p>
                </div>
            </a>

            <a href="update_profile.html" class="action-card">
                <i class="fa-solid fa-user-pen"></i>
                <div>
                    <h4>প্রোফাইল আপডেট</h4>
                    <p>দোকানের তথ্য পরিবর্তন করুন</p>
                </div>
            </a>

            <a href="support.html" class="action-card">
                <i class="fa-solid fa-headset"></i>
                <div>
                    <h4>সাপোর্ট / যোগাযোগ</h4>
                    <p>আমাদের সাথে যোগাযোগ করুন</p>
                </div>
            </a>
        </div>

        <!-- আমার আপলোড করা পণ্যের তালিকা সেকশন -->
        <div class="card-box">
            <div class="section-title">
                <i class="fa-solid fa-box-open"></i>
                <span data-en="My Uploaded Products" data-bn="আমার আপলোড করা পণ্যসমূহ">আমার আপলোড করা পণ্যসমূহ</span>
            </div>
            <div id="myProductsList">
                <div class="empty-text">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 20px; color: #ff5722; margin-bottom: 8px;"></i><br>
                    <span data-en="Loading products..." data-bn="পণ্য লোড হচ্ছে...">পণ্য লোড হচ্ছে...</span>
                </div>
            </div>
        </div>

    </div>

    <!-- স্ক্রিপ্ট -->
    <script>
        const SUPABASE_URL = 'https://mzqqkkgdggwmpegvqaol.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16cXFra2dkZ2d3bXBlZ3ZxYW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDU4NDUsImV4cCI6MjEwMjM4MTg0NX0.hbUQ4dKjX2iXTF-ugi7JkV_-J5gKIpSEsPN8RpJ0EEo';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentSeller = JSON.parse(localStorage.getItem('current_seller'));

        if (!currentSeller) {
            alert('প্রথমে সেলার লগইন করুন!');
            window.location.href = 'seller_login.html';
        }

        function loadSellerInfo() {
            document.getElementById('sellerIdDisplay').innerText = currentSeller.id;
            document.getElementById('shopNameDisplay').innerText = currentSeller.shop_name;
            document.getElementById('ownerNameDisplay').innerText = `মালিক: ${currentSeller.owner_name}`;
            document.getElementById('locationDisplay').innerText = `এলাকা: ${currentSeller.union_name || ''}, ${currentSeller.thana || ''}, ${currentSeller.district || ''}`;
            document.getElementById('coinCount').innerText = currentSeller.coins;

            // ডাটাবেজের seller_url কলাম থেকে সেলারের ছবি সেট করা
            if (currentSeller.seller_url) {
                document.getElementById('sellerImgDisplay').src = currentSeller.seller_url;
            }

            fetchMyProducts();
        }

        async function fetchMyProducts() {
            const listDiv = document.getElementById('myProductsList');
            try {
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .eq('seller_id', currentSeller.id);

                if (error || !data || data.length === 0) {
                    listDiv.innerHTML = '<div class="empty-text">আপনি এখনো কোনো পণ্য আপলোড করেননি।</div>';
                    return;
                }

                let html = '';
                data.forEach(p => {
                    html += `
                        <div class="product-item">
                            <div class="prod-info-left">
                                <img src="${p.image_url}" class="prod-thumb" onerror="this.src='https://via.placeholder.com/45'">
                                <div class="prod-details">
                                    <h4>${p.name}</h4>
                                    <span>৳${p.price}</span>
                                </div>
                            </div>
                            <button class="delete-btn" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i> ডিলিট</button>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;

            } catch (err) {
                console.error('প্রোডাক্ট ফেচ এরর:', err);
            }
        }

        async function deleteProduct(prodId) {
            if (!confirm('আপনি কি এই পণ্যটি ডিলিট করতে চান?')) return;

            const { error } = await supabaseClient.from('products').delete().eq('id', prodId);
            if (error) {
                alert('ডিলিট করতে সমস্যা হয়েছে: ' + error.message);
            } else {
                alert('পণ্যটি সফলভাবে ডিলিট করা হয়েছে!');
                fetchMyProducts();
            }
        }

        function logoutSeller() {
            localStorage.removeItem('current_seller');
            window.location.href = 'seller_login.html';
        }

        window.onload = () => {
            loadSellerInfo();
        };
    </script>
</body>
</html>
