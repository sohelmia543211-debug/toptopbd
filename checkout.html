<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার কনফার্ম করুন - TopTop BD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #f7f7f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .order-container {
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #ff5722;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: #222;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .product-summary {
            display: flex;
            gap: 15px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            align-items: center;
        }
        .product-summary img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            background: #ddd;
        }
        .product-info h3 {
            font-size: 15px;
            margin: 0 0 5px 0;
            color: #222;
        }
        .product-info .price {
            font-size: 16px;
            font-weight: 700;
            color: #ff5722;
            margin: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: #ff5722;
        }
        textarea.form-control {
            resize: vertical;
            height: 70px;
        }
        .delivery-options {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .delivery-card {
            flex: 1;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }
        .delivery-card input {
            display: none;
        }
        .delivery-card.selected {
            border-color: #ff5722;
            background: #fff5f5;
        }
        .delivery-card .area-name {
            font-weight: 600;
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
        }
        .delivery-card .area-charge {
            font-size: 13px;
            color: #ff5722;
            font-weight: 700;
        }
        .bill-summary {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #eee;
        }
        .bill-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }
        .bill-row.total {
            font-weight: 700;
            font-size: 16px;
            color: #222;
            border-top: 1px dashed #ddd;
            padding-top: 8px;
            margin-top: 8px;
        }
        .bill-row.total span:last-child {
            color: #ff5722;
        }
        .cod-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #c8e6c9;
        }
        .submit-order-btn {
            background: #ff5722;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(255, 87, 34, 0.3);
            transition: opacity 0.2s;
        }
        .submit-order-btn:hover {
            opacity: 0.9;
        }
        .submit-order-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="order-container">
        <a href="javascript:history.back()" class="back-btn"><i class="fa-solid fa-arrow-left"></i> প্রোডাক্টে ফিরে যান</a>
        
        <div class="page-title"><i class="fa-solid fa-bag-shopping"></i> অর্ডার কনফার্ম করুন</div>

        <div id="productSummaryBox" class="product-summary">
            <p style="margin: 0; color: #777;">লোড হচ্ছে...</p>
        </div>

        <div class="cod-badge">
            <i class="fa-solid fa-truck-fast"></i> ক্যাশ অন ডেলিভারি (পণ্য হাতে পেয়ে মূল্য পরিশোধ)
        </div>

        <form id="orderForm" onsubmit="submitOrderToDatabase(event)">
            <div class="form-group">
                <label>আপনার নাম *</label>
                <input type="text" id="customerName" class="form-control" placeholder="আপনার সম্পূর্ণ নাম লিখুন" required>
            </div>

            <div class="form-group">
                <label>মোবাইল নম্বর *</label>
                <input type="tel" id="customerPhone" class="form-control" placeholder="যেমন: 01712345678" required>
            </div>

            <div class="delivery-options">
                <label class="delivery-card selected" onclick="setDeliveryCharge(80, this)">
                    <input type="radio" name="deliveryArea" value="Dhaka" checked>
                    <div class="area-name">ঢাকার ভেতরে</div>
                    <div class="area-charge">৮০ টাকা</div>
                </label>
                <label class="delivery-card" onclick="setDeliveryCharge(129, this)">
                    <input type="radio" name="deliveryArea" value="Outside">
                    <div class="area-name">ঢাকার বাইরে</div>
                    <div class="area-charge">১২৯ টাকা</div>
                </label>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>জেলা (District) *</label>
                    <input type="text" id="customerDistrict" class="form-control" placeholder="যেমন: ঢাকা" required>
                </div>
                <div class="form-group">
                    <label>থানা / উপজেলা (Thana) *</label>
                    <input type="text" id="customerThana" class="form-control" placeholder="যেমন: মিরপুর" required>
                </div>
            </div>

            <div class="form-group">
                <label>বিস্তারিত ঠিকানা (বাসা/রোড নম্বর ইত্যাদি) *</label>
                <textarea id="customerAddress" class="form-control" placeholder="বাসা নম্বর, রোড নম্বর বা এলাকার বিবরণ..." required></textarea>
            </div>

            <div class="bill-summary">
                <div class="bill-row">
                    <span>প্রোডাক্টের দাম:</span>
                    <span id="subtotalPrice">৳ 0</span>
                </div>
                <div class="bill-row">
                    <span>ডেলিভারি চার্জ:</span>
                    <span id="deliveryChargeText">৳ 80</span>
                </div>
                <div class="bill-row total">
                    <span>সর্বমোট প্রদেয়:</span>
                    <span id="totalPrice">৳ 0</span>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-order-btn">
                অর্ডার কনফার্ম করুন
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://mzqqkkgdggwmpegvqaol.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16cXFra2dkZ2d3bXBlZ3ZxYW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDU4NDUsImV4cCI6MjEwMjM4MTg0NX0.hbUQ4dKjX2iXTF-ugi7JkV_-J5gKIpSEsPN8RpJ0EEo';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentProduct = null;
        let deliveryFee = 80;

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function fetchCheckoutProduct() {
            const summaryBox = document.getElementById('productSummaryBox');

            if (!productId) {
                summaryBox.innerHTML = `<p style="color:red; margin:0;">প্রোডাক্ট আইডি পাওয়া যায়নি!</p>`;
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .eq('id', productId)
                    .single();

                if (error || !data) {
                    summaryBox.innerHTML = `<p style="color:red; margin:0;">প্রোডাক্ট ডাটা লোড করা যায়নি।</p>`;
                    return;
                }

                currentProduct = data;
                let imgSrc = data.image_url || 'https://via.placeholder.com/150';

                summaryBox.innerHTML = `
                    <img src="${imgSrc}" alt="${data.name}">
                    <div class="product-info">
                        <h3>${data.name}</h3>
                        <p class="price">৳ ${data.price}</p>
                    </div>
                `;

                updateTotalCalculation();

            } catch (err) {
                console.error(err);
                summaryBox.innerHTML = `<p style="color:red; margin:0;">কানেকশন এরর হয়েছে!</p>`;
            }
        }

        function setDeliveryCharge(charge, element) {
            deliveryFee = charge;
            
            document.querySelectorAll('.delivery-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            element.querySelector('input').checked = true;

            updateTotalCalculation();
        }

        function updateTotalCalculation() {
            if (!currentProduct) return;
            let productPrice = Number(currentProduct.price) || 0;
            let total = productPrice + deliveryFee;

            document.getElementById('subtotalPrice').innerText = `৳ ${productPrice}`;
            document.getElementById('deliveryChargeText').innerText = `৳ ${deliveryFee}`;
            document.getElementById('totalPrice').innerText = `৳ ${total}`;
        }

        async function submitOrderToDatabase(event) {
            event.preventDefault();
            if (!currentProduct) return;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "অর্ডার প্রসেসিং হচ্ছে...";

            let name = document.getElementById('customerName').value.trim();
            let phone = document.getElementById('customerPhone').value.trim();
            let district = document.getElementById('customerDistrict').value.trim();
            let thana = document.getElementById('customerThana').value.trim();
            let address = document.getElementById('customerAddress').value.trim();
            let areaType = document.querySelector('input[name="deliveryArea"]:checked').value;
            let areaNameText = (areaType === 'Dhaka') ? 'ঢাকার ভেতরে' : 'ঢাকার বাইরে';

            let productPrice = Number(currentProduct.price) || 0;
            let totalAmount = productPrice + deliveryFee;

            const orderData = {
                product_id: Number(currentProduct.id),
                product_name: String(currentProduct.name),
                product_price: Number(productPrice),
                product_image: String(currentProduct.image_url || ''),
                customer_name: String(name),
                customer_phone: String(phone),
                delivery_area: String(areaNameText),
                delivery_charge: String(deliveryFee),
                total_amount: String(totalAmount),
                address: String(`ঠিকানা: ${address}, থানা: ${thana}, জেলা: ${district}`),
                order_status: 'Pending'
            };

            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .insert([orderData]);

                if (error) {
                    console.error("Supabase Error Details:", error);
                    alert("অর্ডার সেভ করতে সমস্যা হয়েছে: " + error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "অর্ডার কনফার্ম করুন";
                    return;
                }

                // লোকাল স্টোরেজে গ্রাহকের ফোন নম্বর সেভ করে রাখা যাতে 'আমার অর্ডার' পেজে সরাসরি দেখা যায়
                localStorage.setItem('topTopCustomerPhone', phone);

                // সফল মেসেজ দেখিয়ে মাই অর্ডার পেজে রিডাইরেক্ট করা
                alert("আপনার অর্ডারটি সফলভাবে সম্পন্ন হয়েছে! ধন্যবাদ।");
                window.location.href = "my_orders.html";

            } catch (err) {
                console.error("Network Exception:", err);
                alert("নেটওয়ার্ক সমস্যা! দয়া করে আবার চেষ্টা করুন।");
                submitBtn.disabled = false;
                submitBtn.innerText = "অর্ডার কনফার্ম করুন";
            }
        }

        window.onload = fetchCheckoutProduct;
    </script>
</body>
</html>
