<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopTop BD - লোকাল মার্কেটপ্লেস (নতুন ও পুরনো পণ্য)</title>
    <!-- FontAwesome আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- স্টাইল ফাইল লিংক -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ১. হেডার ও সার্চ বার -->
    <header>
        <h1>TopTop BD</h1>
        <input type="text" id="searchBox" class="search-box" placeholder="আপনার পছন্দের পণ্য খুঁজুন...">
    </header>

    <!-- ২. ডাইনামিক ব্যানার সেকশন -->
    <div class="banner-container" id="bannerContainer">
        <div class="banner-slider">
            লোড হচ্ছে...
        </div>
    </div>

    <!-- ৩. প্রোডাক্ট টাইপ ও ডায়নামিক লোকেশন ফিল্টার সেকশন -->
    <div class="filter-dropdown-container" style="display: flex; justify-content: center; gap: 10px; margin: 20px 10px; flex-wrap: wrap;">
        <!-- প্রোডাক্ট টাইপ ফিল্টার -->
        <select id="productTypeFilter" onchange="filterProductsByType(this.value)" style="padding: 12px 15px; font-size: 15px; font-weight: bold; border-radius: 25px; border: 2px solid #ff5722; background-color: #fff; color: #333; cursor: pointer; outline: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <option value="used_product" selected>🔄 পুরনো পণ্য</option>
            <option value="new_product">✨ নতুন পণ্য</option>
            <option value="land_property">🏠 জমি ও প্রপার্টি</option>
        </select>

        <!-- ১. জেলা (District) ড্রপডাউন (সব সময় থাকবে) -->
        <select id="districtFilter" onchange="onDistrictChange(this.value)" style="padding: 12px 15px; font-size: 15px; font-weight: bold; border-radius: 25px; border: 2px solid #ff5722; background-color: #fff; color: #333; cursor: pointer; outline: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <option value="সব" selected>📍 সব জেলা</option>
        </select>

        <!-- ২. থানা (Thana) ড্রপডাউন (জেলা সিলেক্ট করলে দৃশ্যমান হবে) -->
        <select id="thanaFilter" onchange="onThanaChange(this.value)" style="display: none; padding: 12px 15px; font-size: 15px; font-weight: bold; border-radius: 25px; border: 2px solid #ff5722; background-color: #fff; color: #333; cursor: pointer; outline: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <option value="সব" selected>📍 সব থানা</option>
        </select>

        <!-- ৩. ইউনিয়ন (Union) ড্রপডাউন (থানা সিলেক্ট করলে দৃশ্যমান হবে) -->
        <select id="unionFilter" onchange="onUnionChange(this.value)" style="display: none; padding: 12px 15px; font-size: 15px; font-weight: bold; border-radius: 25px; border: 2px solid #ff5722; background-color: #fff; color: #333; cursor: pointer; outline: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <option value="সব" selected>📍 সব ইউনিয়ন</option>
        </select>
    </div>

    <!-- ৪. মেইন ক্যাটাগরি সেকশন -->
    <div class="categories-container">
        <div class="section-title">ক্যাটাগরি সমূহ</div>
        <div class="categories-grid" id="mainCategories"></div>
    </div>

    <!-- ৫. সাব-ক্যাটাগরি সেকশন -->
    <div class="sub-categories-container">
        <div class="section-title">সাব-ক্যাটাগরি সমূহ</div>
        <div class="sub-categories-grid" id="subCategories"></div>
    </div>

    <!-- ৬. প্রোডাক্ট সেকশন -->
    <div class="container">
        <div class="section-title">প্রোডাক্টসমূহ</div>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- ৭. বটম নেভিগেশন বার -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="categories.html" class="bottom-nav-item">
            <i class="fa-solid fa-list"></i>
            <span>Category</span>
        </a>
        <a href="favorites.html" class="bottom-nav-item">
            <i class="fa-solid fa-heart"></i>
            <span>Favorite</span>
        </a>
        <a href="seller_login.html" class="bottom-nav-item">
            <i class="fa-solid fa-user-tie"></i>
            <span>Seller Login</span>
        </a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
