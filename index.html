<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="TopTop BD - Local Marketplace" data-bn="TopTop BD - লোকাল মার্কেটপ্লেস (নতুন ও পুরনো পণ্য)">TopTop BD - লোকাল মার্কেটপ্লেস (নতুন ও পুরনো পণ্য)</title>
    
    <!-- FontAwesome আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- স্টাইল ফাইল লিংক -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* প্রিমিয়াম সার্চ বারের ডিজাইন (বড় ও সুন্দর করার জন্য) */
        .top-search-section {
            width: 100%;
            max-width: 950px;
            margin: 20px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }
        .top-search-box {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid #ff5722;
            border-radius: 50px;
            padding: 6px 6px 6px 20px;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.15);
        }
        .search-icon {
            color: #ff5722;
            font-size: 22px;
            margin-right: 15px;
        }
        .top-search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            background: transparent;
            padding: 10px 0;
        }
        .top-search-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .top-search-btn:hover {
            background: #e64a19;
        }
    </style>
</head>
<body>

    <!-- ১. হেডার -->
    <header>
        <div class="header-top">
            <h1>TopTop BD</h1>
            <button class="lang-switch-btn" id="langSwitchBtn" onclick="toggleLanguage()">English</button>
        </div>
    </header>

    <!-- ২. প্রিমিয়াম বড় সার্চ বার (ব্যানারের উপরে) -->
    <div class="top-search-section">
        <div class="top-search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="mainSearchInput" oninput="handleSearchInput(this.value)" data-en-placeholder="Search products..." data-bn-placeholder="পণ্য খুঁজুন..." placeholder="পণ্য খুঁজুন...">
            <button class="top-search-btn" onclick="triggerSearch()">
                <span data-en="Search" data-bn="সার্চ">সার্চ</span>
            </button>
        </div>
    </div>

    <!-- ৩. ডাইনামিক ব্যানার সেকশন -->
    <div class="banner-container" id="bannerContainer">
        <div class="banner-slider" data-en="Loading..." data-bn="লোড হচ্ছে...">
            লোড হচ্ছে...
        </div>
    </div>

    <!-- ৪. ব্যানার ও ক্যাটাগরির মাঝে ফিল্টার বার (মাত্র দুটি ড্রপডাউন) -->
    <div class="search-location-bar" id="searchBarContainer" style="width: 100%; max-width: 950px; margin: 15px auto; padding: 0 15px; box-sizing: border-box;">
        <!-- ডাইনামিকালি script.js দ্বারা রেন্ডার হবে -->
    </div>

    <!-- ৫. মেইন ক্যাটাগরি সেকশন -->
    <div class="categories-container">
        <div class="section-title" data-en="Categories" data-bn="ক্যাটাগরি সমূহ">ক্যাটাগরি সমূহ</div>
        <div class="categories-grid" id="mainCategories"></div>
    </div>

    <!-- ৬. সাব-ক্যাটাগরি সেকশন -->
    <div class="sub-categories-container">
        <div class="section-title" data-en="Sub-Categories" data-bn="সাব-ক্যাটাগরি সমূহ">সাব-ক্যাটাগরি সমূহ</div>
        <div class="sub-categories-grid" id="subCategories"></div>
    </div>

    <!-- ৭. প্রোডাক্ট সেকশন -->
    <div class="container">
        <div class="section-title" data-en="Products" data-bn="প্রোডাক্টসমূহ">প্রোডাক্টসমূহ</div>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- ৮. বটম নেভিগেশন বার -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item active">
            <i class="fa-solid fa-house"></i>
            <span data-en="Home" data-bn="হোম">হোম</span>
        </a>
        <a href="categories.html" class="bottom-nav-item">
            <i class="fa-solid fa-list"></i>
            <span data-en="Category" data-bn="ক্যাটাগরি">ক্যাটাগরি</span>
        </a>
        <a href="favorites.html" class="bottom-nav-item">
            <i class="fa-solid fa-heart"></i>
            <span data-en="Favorite" data-bn="পছন্দ">পছন্দ</span>
        </a>
        <a href="seller_login.html" class="bottom-nav-item">
            <i class="fa-solid fa-user-tie"></i>
            <span data-en="Seller Login" data-bn="সেলার লগইন">সেলার লগইন</span>
        </a>
    </nav>

    <!-- ভাষা ও অন্যান্য স্ক্রিপ্ট -->
    <script>
        let currentLang = localStorage.getItem('toptop_lang') || 'bn';

        function toggleLanguage() {
            currentLang = currentLang === 'bn' ? 'en' : 'bn';
            localStorage.setItem('toptop_lang', currentLang);
            applyLanguage();
            if (typeof renderMainCategories === 'function') renderMainCategories();
            if (typeof renderSubCategories === 'function') renderSubCategories();
            if (typeof renderFilterCards === 'function') renderFilterCards();
            if (typeof renderProducts === 'function') renderProducts();
        }

        function applyLanguage() {
            const langBtn = document.getElementById('langSwitchBtn');
            if(langBtn) langBtn.innerText = currentLang === 'bn' ? 'English' : 'বাংলা';
            document.documentElement.setAttribute('lang', currentLang);

            document.querySelectorAll('[data-bn]').forEach(el => {
                if (currentLang === 'en' && el.getAttribute('data-en')) {
                    el.innerText = el.getAttribute('data-en');
                } else if (currentLang === 'bn' && el.getAttribute('data-bn')) {
                    el.innerText = el.getAttribute('data-bn');
                }
            });

            document.querySelectorAll('[data-bn-placeholder]').forEach(el => {
                if (currentLang === 'en' && el.getAttribute('data-en-placeholder')) {
                    el.placeholder = el.getAttribute('data-en-placeholder');
                } else if (currentLang === 'bn' && el.getAttribute('data-bn-placeholder')) {
                    el.placeholder = el.getAttribute('data-bn-placeholder');
                }
            });
            
            document.querySelectorAll('option[data-bn]').forEach(opt => {
                if (currentLang === 'en' && opt.getAttribute('data-en')) {
                    opt.innerText = opt.getAttribute('data-en');
                } else if (currentLang === 'bn' && opt.getAttribute('data-bn')) {
                    opt.innerText = opt.getAttribute('data-bn');
                }
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
