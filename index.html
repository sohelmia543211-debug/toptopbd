<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- এসইও এবং সার্চ অপ্টিমাইজেশন টাইটেল -->
    <title data-en="TopTop BD - Online Shopping & E-Commerce Store" data-bn="TopTop BD - অনলাইন শপিং ও ই-কমার্স স্টোর">TopTop BD - অনলাইন শপিং ও ই-কমার্স স্টোর</title>
    
    <!-- এসইও মেটা ডেসক্রিপশন ও কিওয়ার্ডস -->
    <meta name="description" content="TopTop BD is your trusted online shopping store in Bangladesh for smart gadgets, electronics, cosmetics, and best quality products at affordable prices.">
    <meta name="keywords" content="toptopbd, toptop, online shopping bangladesh, electronics, cosmetics, kitchen gadgets, toptop bd shop">
    <meta name="author" content="TopTop BD">

    <!-- ব্রাউজার ট্যাব লোগো (Favicon) - আপনার লোগোর ফাইল পাথ এখানে ঠিক করুন -->
    <link rel="icon" type="image/png" href="logo.png"> 
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">

    <!-- কাস্টম স্টাইল যাতে লোগোটি সুন্দরভাবে বসে -->
    <style>
        .logo-link img {
            height: 45px; /* লোগোর উচ্চতা নির্ধারণ করুন */
            width: auto;
            object-fit: contain;
            border-radius: 8px;
            vertical-align: middle;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #fff; /* হেডার ব্যাকগ্রাউন্ড কালার */
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <!-- এখানে টেক্সটের বদলে লোগো ইমেজ ব্যবহার করা হয়েছে -->
            <a href="index.html" class="logo-link">
                <img src="logo.png" alt="TopTop BD Logo">
            </a>
            <button class="lang-switch-btn" id="langSwitchBtn" onclick="toggleLanguage()">English</button>
        </div>
        <div class="search-location-bar" id="searchBarContainer"></div>
    </header>

    <div class="banner-container" id="bannerContainer">
        <div class="banner-slider" data-en="Loading..." data-bn="লোড হচ্ছে...">
            লোড হচ্ছে...
        </div>
    </div>

    <div class="categories-container">
        <div class="section-title" data-en="Categories" data-bn="ক্যাটাগরি সমূহ">ক্যাটাগরি সমূহ</div>
        <div class="categories-grid" id="mainCategories"></div>
    </div>

    <div class="sub-categories-container">
        <div class="section-title" data-en="Sub-Categories" data-bn="সাব-ক্যাটাগরি সমূহ">সাব-ক্যাটাগরি সমূহ</div>
        <div class="sub-categories-grid" id="subCategories"></div>
    </div>

    <div class="container">
        <div class="section-title" data-en="Products" data-bn="প্রোডাক্টসমূহ">প্রোডাক্টসমূহ</div>
        <div class="product-grid" id="productGrid" style="min-height: 250px;"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item active">
            <i class="fa-solid fa-house"></i>
            <span data-en="Home" data-bn="হোম">হোম</span>
        </a>
        <a href="categories.html" class="bottom-nav-item">
            <i class="fa-solid fa-list"></i>
            <span data-en="Category" data-bn="ক্যাটাগরি">ক্যাটাগরি</span>
        </a>
        <a href="my_orders.html" class="bottom-nav-item">
            <i class="fa-solid fa-box-archive"></i>
            <span data-en="My Orders" data-bn="আমার অর্ডার">আমার অর্ডার</span>
        </a>
        <a href="favorites.html" class="bottom-nav-item">
            <i class="fa-solid fa-heart"></i>
            <span data-en="Favorite" data-bn="পছন্দ">পছন্দ</span>
        </a>
        <a href="support.html" class="bottom-nav-item">
            <i class="fa-solid fa-headset"></i>
            <span data-en="Support" data-bn="সাপোর্ট">সাপোর্ট</span>
        </a>
    </nav>

    <script>
        let currentLang = localStorage.getItem('toptop_lang') || 'bn';

        function applyLanguage() {
            const langBtn = document.getElementById('langSwitchBtn');
            if(langBtn) langBtn.innerText = currentLang === 'bn' ? 'English' : 'বাংলা';
            document.documentElement.setAttribute('lang', currentLang);

            document.querySelectorAll('[data-bn]').forEach(el => {
                if (currentLang === 'en' && el.getAttribute('data-en')) {
                    el.innerText = el.getAttribute('data-en');
                } else if (currentLang === 'bn' && el.getAttribute('data-bn')) {
                    el.innerText = el.getAttribute('data-bn');
                }
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'bn' ? 'en' : 'bn';
            localStorage.setItem('toptop_lang', currentLang);
            applyLanguage();
            
            setTimeout(() => {
                if (typeof renderMainCategories === 'function') renderMainCategories();
                if (typeof renderSubCategories === 'function') renderSubCategories();
                if (typeof renderFilterCards === 'function') renderFilterCards();
                if (typeof loadProducts === 'function') loadProducts(false);
            }, 10);
        }

        // পেজ রেন্ডার হওয়ার সাথে সাথেই ভাষা সেট করার জন্য
        applyLanguage();
    </script>
    <script src="script.js"></script>
</body>
</html>
