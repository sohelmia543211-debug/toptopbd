<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopTop BD - ক্যাটাগরি সমূহ</title>
    <!-- FontAwesome আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase লাইব্রেরি -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- হেডার -->
    <header style="background: #ff5722; color: white; padding: 12px 15px; text-align: center; font-size: 18px; font-weight: bold;">
        <i class="fa-solid fa-list"></i> TopTop BD - সকল ক্যাটাগরি
    </header>

    <!-- ক্যাটাগরি লেআউট কন্টেইনার -->
    <div class="category-page-container" style="display: flex; height: calc(100vh - 110px); background: #f9f9f9;">
        
        <!-- বাম পাশের সাইডবার (মেইন ক্যাটাগরি) -->
        <div class="main-category-sidebar" id="mainCategorySidebar" style="width: 30%; background: #fff; border-right: 1px solid #ddd; overflow-y: auto;">
            <!-- ডাইনামিক মেইন ক্যাটাগরিগুলো এখানে জাভাস্ক্রিপ্ট দিয়ে লোড হবে -->
        </div>

        <!-- ডান পাশের কনটেন্ট এরিয়া (সাব-ক্যাটাগরি) -->
        <div class="sub-category-content" style="width: 70%; padding: 15px; overflow-y: auto;">
            <div class="section-title" style="font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #333;">
                <i class="fa-solid fa-tags" style="color: #ff5722;"></i> সাব-ক্যাটাগরি সমূহ
            </div>
            <div class="sub-category-grid" id="subCategoryGrid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                <!-- সাব-ক্যাটাগরি কার্ডগুলো এখানে ডাইনামিকালি লোড হবে -->
            </div>
        </div>
    </div>

    <!-- বটম নেভবার -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fa-solid fa-house"></i>
            <span>হোম</span>
        </a>
        <a href="categories.html" class="bottom-nav-item active">
            <i class="fa-solid fa-list"></i>
            <span>ক্যাটাগরি</span>
        </a>
        <a href="favorites.html" class="bottom-nav-item">
            <i class="fa-solid fa-heart"></i>
            <span>পছন্দ</span>
        </a>
        <a href="support.html" class="bottom-nav-item">
            <i class="fa-solid fa-headset"></i>
            <span>সাপোর্ট</span>
        </a>
    </nav>

    <!-- জাভাস্ক্রিপ্ট ফাইল ও কনফিগারেশন -->
    <script>
        const hardcodedCategories = [
          {
            id: 1,
            name: { bn: "ইলেক্ট্রনিক্স", en: "Electronics" },
            icon: "fa-laptop",
            subcategories: [
              { id: 1, name: { bn: "কিচেন গ্যাজেট ও অ্যাপ্লায়েন্সেস", en: "Kitchen Gadgets & Appliances" }, icon: "fa-blender" },
              { id: 2, name: { bn: "স্মার্টফোন ও গ্যাজেট", en: "Smartphones & Gadgets" }, icon: "fa-mobile-screen" },
              { id: 3, name: { bn: "হোম ইউটিলিটি ও লাইটিং", en: "Home Utility & Lighting" }, icon: "fa-lightbulb" },
              { id: 4, name: { bn: "স্মার্ট ওয়াচ ও ইয়ারফোন", en: "Smartwatches & Earphones" }, icon: "fa-headphones" }
            ]
          },
          {
            id: 2,
            name: { bn: "কসমেটিক্স", en: "Cosmetics" },
            icon: "fa-wand-magic-sparkles",
            subcategories: [
              { id: 1, name: { bn: "মেকআপ ও কসমেটিক্স আইটেম", en: "Makeup & Cosmetic Items" }, icon: "fa-palette" },
              { id: 2, name: { bn: "স্কিন কেয়ার ও লোশন", en: "Skin Care & Lotions" }, icon: "fa-pump-soap" },
              { id: 3, name: { bn: "মেকআপ অর্গানাইজার ও বক্স", en: "Makeup Organizers & Boxes" }, icon: "fa-box-archive" }
            ]
          }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            renderCategoryPageSidebar();
        });

        function renderCategoryPageSidebar() {
            const sidebar = document.getElementById('mainCategorySidebar');
            if (!sidebar) return;

            let html = `
                <div onclick="selectCategoryPageMain('সব')" style="padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; background: #fff;" id="cat_all">
                    <i class="fa-solid fa-border-all" style="color: #ff5722;"></i> সব ক্যাটাগরি
                </div>
            `;

            if (typeof hardcodedCategories !== 'undefined') {
                hardcodedCategories.forEach(cat => {
                    const catName = cat.name.bn;
                    html += `
                        <div onclick="selectCategoryPageMain(${cat.id})" style="padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; background: #fff;" id="cat_${cat.id}">
                            <i class="fa-solid ${cat.icon || 'fa-tag'}" style="color: #ff5722;"></i> ${catName}
                        </div>
                    `;
                });
            }

            sidebar.innerHTML = html;
            if (typeof hardcodedCategories !== 'undefined' && hardcodedCategories.length > 0) {
                selectCategoryPageMain(hardcodedCategories[0].id);
            }
        }

        function selectCategoryPageMain(catId) {
            document.querySelectorAll('#mainCategorySidebar > div').forEach(el => el.style.background = '#fff');
            const selectedEl = document.getElementById(catId === 'সব' ? 'cat_all' : `cat_${catId}`);
            if(selectedEl) selectedEl.style.background = '#fff5f2';

            const subGrid = document.getElementById('subCategoryGrid');
            if (!subGrid || typeof hardcodedCategories === 'undefined') return;

            let subs = [];

            if (catId === 'সব') {
                subs = hardcodedCategories.flatMap(c => (c.subcategories || []).map(sub => ({ ...sub, mainCatId: c.id })));
            } else {
                const found = hardcodedCategories.find(c => c.id === catId);
                if (found) {
                    subs = (found.subcategories || []).map(sub => ({ ...sub, mainCatId: found.id }));
                }
            }

            let subHtml = '';
            if(subs.length === 0) {
                subHtml = `<div style="grid-column: 1/-1; text-align:center; color:#777; padding:20px;">কোনো সাব-ক্যাটাগরি নেই</div>`;
            } else {
                subs.forEach(sub => {
                    const subName = sub.name.bn;
                    const mainCatId = sub.mainCatId;
                    
                    // ফিক্সড: category_products.html এর বদলে সঠিক products.html এ রিডায়রেক্ট করা হলো
                    subHtml += `
                        <div onclick="window.location.href='products.html?main_category_id=${mainCatId}&sub_category_id=${sub.id}&sub_name=${encodeURIComponent(subName)}'" style="background: white; padding: 16px 12px; border-radius: 10px; border: 1px solid #eee; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); cursor: pointer; transition: all 0.2s ease;" onmouseover="this.style.borderColor='#ff5722'; this.style.transform='translateY(-2px)';" onmouseout="this.style.borderColor='#eee'; this.style.transform='translateY(0)';">
                            <div style="font-size: 24px; color: #ff5722; background: #fff5f2; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
                                <i class="fa-solid ${sub.icon || 'fa-tag'}"></i>
                            </div>
                            <div style="font-size: 13px; font-weight: 600; color: #333;">${subName}</div>
                        </div>
                    `;
                });
            }
            subGrid.innerHTML = subHtml;
        }
    </script>
</body>
</html>
