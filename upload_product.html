    <style>
        :root {
            --primary: #ff5722;
            --primary-gradient: linear-gradient(135deg, #ff5722 0%, #ff8a50 100%);
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --radius: 14px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: var(--primary-gradient);
            color: white;
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(255, 87, 34, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-top {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-top h1 a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: #fff;
            color: var(--primary);
        }

        .form-container {
            max-width: 650px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .upload-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .upload-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #f7fafc;
            padding-bottom: 12px;
        }
        .upload-title i {
            color: var(--primary);
        }

        .coin-warning {
            background: #fff3ed;
            color: #d97706;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid #ffd8cc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            background: #f8fafc;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }
    </style>

                <div class="form-group">

                    </select>
                </div>

                <div class="form-group">
                    <label>জেলা (District)</label>
                    <select id="districtSelect" class="form-control" onchange="updateThanas()" required>
                        <option value="">জেলা নির্বাচন করুন</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>থানা / উপজেলা (Thana)</label>
                    <select id="thanaSelect" class="form-control" onchange="updateUnions()" required>

                    </select>
                </div>

                <div class="form-group">
                    <label>ইউনিয়ন / এলাকা (Union)</label>
                    <select id="unionSelect" class="form-control" required>
                        <option value="">প্রথমে থানা নির্বাচন করুন</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>পণ্যের দাম (টাকা)</label>
                    <input type="number" id="prodPrice" class="form-control" placeholder="যেমন: ৫০০" required>
                </div>

                <div class="form-group">
                    <label>প্রধান ছবি (Main Image) - আবশ্যিক</label>
                    <input type="file" id="prodImage1" class="form-control" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label>দ্বিতীয় ছবি (Image 2) - ঐচ্ছিক</label>
                    <input type="file" id="prodImage2" class="form-control" accept="image/*">
                </div>

                <div class="form-group">
                    <label>তৃতীয় ছবি (Image 3) - ঐচ্ছিক</label>
                    <input type="file" id="prodImage3" class="form-control" accept="image/*">

                </div>

                <div class="form-group">

                </div>

                <div class="form-group">
                    <label>পণ্যের বিবরণ (Description)</label>
                    <textarea id="prodDesc" class="form-control" placeholder="পণ্যের সাইজ, কালার বা অন্যান্য বিবরণ লিখুন..."></textarea>
                </div>

            const mainSelect = document.getElementById('mainCategorySelect');
            let html = '<option value="">ক্যাটেগরি নির্বাচন করুন</option>';
            hardcodedCategories.forEach(cat => {
                html += `<option value="${cat.id}">${cat.name.bn}</option>`;
            });
            mainSelect.innerHTML = html;
        }

            const mainId = document.getElementById('mainCategorySelect').value;
            const subSelect = document.getElementById('subCategorySelect');
            
            let html = '<option value="">সাব-ক্যাটেগরি নির্বাচন করুন</option>';
            const selectedCat = hardcodedCategories.find(c => c.id === mainId);
            
            if (selectedCat && selectedCat.subcategories) {
                selectedCat.subcategories.forEach(sub => {
                    html += `<option value="${sub.name.bn}">${sub.name.bn}</option>`;
                });
            }
            subSelect.innerHTML = html;
        }

        async function fetchLocationsFromSupabase() {
            try {
                const { data, error } = await supabaseClient.from('locations').select('*');
                if (error) throw error;
                if (data && data.length > 0) {
                    globalLocations = data;
                    loadDistricts();
                } else {
                    console.warn('Locations table is empty or not found.');
                }
            } catch (err) {
                console.error('লোকেশন লোড করতে সমস্যা হয়েছে:', err);
            }
        }

        function loadDistricts() {
            const districtSelect = document.getElementById('districtSelect');
            const districts = [...new Set(globalLocations.map(item => item.district || item.district_name || item.zilla))].filter(Boolean);
            
            let html = '<option value="">জেলা নির্বাচন করুন</option>';
            districts.sort().forEach(d => {
                html += `<option value="${d}">${d}</option>`;
            });
            districtSelect.innerHTML = html;
        }

        function updateThanas() {
            const selectedDistrict = document.getElementById('districtSelect').value;
            const thanaSelect = document.getElementById('thanaSelect');
            const unionSelect = document.getElementById('unionSelect');
            
            unionSelect.innerHTML = '<option value="">প্রথমে থানা নির্বাচন করুন</option>';
            
            let html = '<option value="">থানা নির্বাচন করুন</option>';
            if (!selectedDistrict) {
                thanaSelect.innerHTML = html;
                return;
            }

            const filteredThanas = globalLocations.filter(item => 
                (item.district === selectedDistrict || item.district_name === selectedDistrict || item.zilla === selectedDistrict)
            );
            const thanas = [...new Set(filteredThanas.map(item => item.thana || item.upazila || item.thana_name))].filter(Boolean);
            
            thanas.sort().forEach(t => {
                html += `<option value="${t}">${t}</option>`;
            });
            thanaSelect.innerHTML = html;
        }

        function updateUnions() {
            const selectedDistrict = document.getElementById('districtSelect').value;
            const selectedThana = document.getElementById('thanaSelect').value;
            const unionSelect = document.getElementById('unionSelect');

            let html = '<option value="">ইউনিয়ন নির্বাচন করুন</option>';
            if (!selectedThana) {
                unionSelect.innerHTML = html;
                return;
            }

            const filteredUnions = globalLocations.filter(item => 
                (item.district === selectedDistrict || item.district_name === selectedDistrict || item.zilla === selectedDistrict) && 
                (item.thana === selectedThana || item.upazila === selectedThana || item.thana_name === selectedThana)
            );
            const unions = [...new Set(filteredUnions.map(item => item.union_name || item.union || item.area))].filter(Boolean);
            
            unions.sort().forEach(u => {
                html += `<option value="${u}">${u}</option>`;
            });
            unionSelect.innerHTML = html;
        }

        async function uploadImageToBucket(file) {
            if (!file) return null;
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;
            const filePath = `${fileName}`;

            const { data, error } = await supabaseClient.storage
                .from('ProductBucket')
                .upload(filePath, file);

            if (error) throw error;

            const { data: publicUrlData } = supabaseClient.storage
                .from('ProductBucket')
                .getPublicUrl(filePath);

            return publicUrlData.publicUrl;
        }

        // WhatsApp লিংক ফরম্যাটিং ফাংশন
        function formatWhatsAppLink(input) {
            let val = input.trim();
            if (!val) return '';
            
            // যদি ইনপুটটি পুরো URL হয়
            if (val.startsWith('http://') || val.startsWith('https://')) {
                return val;
            }
            
            // শুধুমাত্র নম্বর দিলে (যেমন: 01712...) সেটিকে wa.me ফরম্যাটে রূপান্তর করা
            let cleanNumber = val.replace(/\D/g, ''); // শুধু ডিজিট রাখা
            if (cleanNumber.startsWith('88')) {
                return `https://wa.me/${cleanNumber}`;
            } else if (cleanNumber.length === 11) {
                return `https://wa.me/88${cleanNumber}`;
            } else {
                return `https://wa.me/${cleanNumber}`;
            }
        }

        // Messenger লিংক ফরম্যাটিং ফাংশন
        function formatMessengerLink(input) {
            let val = input.trim();
            if (!val) return '';
            
            // যদি ইনপুটটি পুরো URL হয়
            if (val.startsWith('http://') || val.startsWith('https://')) {
                // facebook.com বা m.me লিংকে রূপান্তরের প্রয়োজন থাকলে তা করা যাবে, তবে ইউজার যা দেবে তা ঠিক থাকলে সরাসরি রিটার্ন করবে
                return val;
            }
            
            // শুধু ইউজারনেম দিলে m.me/... ফরম্যাটে রূপান্তর করা
            let username = val.replace('@', '');
            return `https://m.me/${username}`;
        }

        async function uploadProduct(event) {
            event.preventDefault();

            if (currentSeller.coins < 1) {
                alert('আপনার অ্যাকাউন্টে পর্যাপ্ত কয়েন নেই! পণ্য আপলোড করতে হলে কয়েন রিচার্জ করুন।');
                window.location.href = 'coin_recharge.html';
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ছবি ও ডাটা আপলোড হচ্ছে...';

            try {
                const imageFile1 = document.getElementById('prodImage1').files[0];
                const imageFile2 = document.getElementById('prodImage2').files[0];
                const imageFile3 = document.getElementById('prodImage3').files[0];

                let imageUrl1 = await uploadImageToBucket(imageFile1);
                let imageUrl2 = imageFile2 ? await uploadImageToBucket(imageFile2) : null;
                let imageUrl3 = imageFile3 ? await uploadImageToBucket(imageFile3) : null;

                const name = document.getElementById('prodName').value;
                const productType = document.getElementById('prodType').value;
                const mainCatId = document.getElementById('mainCategorySelect').value;
                const mainCatObj = hardcodedCategories.find(c => c.id === mainCatId);
                const category = mainCatObj ? mainCatObj.name.bn : '';
                const subCategory = document.getElementById('subCategorySelect').value;
                
                const district = document.getElementById('districtSelect').value;
                const thana = document.getElementById('thanaSelect').value;
                const unionName = document.getElementById('unionSelect').value;
                
                const price = parseFloat(document.getElementById('prodPrice').value);
                const description = document.getElementById('prodDesc').value;
                
                // হোয়াটসঅ্যাপ এবং মেসেঞ্জার লিংক প্রসেসিং
                const rawWhatsapp = document.getElementById('whatsappLink').value;
                const rawMessenger = document.getElementById('messengerLink').value;
                
                const whatsappLink = formatWhatsAppLink(rawWhatsapp);
                const messengerLink = formatMessengerLink(rawMessenger);

                const { error: insertError } = await supabaseClient
                    .from('products')
                    .insert([
                        {
                            seller_id: currentSeller.id,
                            name: name,
                            product_type: productType,
                            category: category,
                            category_id: mainCatId,
                            sub_category: subCategory,
                            price: price,
                            image_url: imageUrl1,
                            image_url_1: imageUrl2,
                            image_url_2: imageUrl3,
                            whatsapp_link: whatsappLink,
                            messenger_link: messengerLink,
                            short_description: description,
                            union_name: unionName,
                            thana: thana,
                            district: district
                        }
                    ]);

                if (insertError) throw insertError;

                const newCoins = currentSeller.coins - 1;
                const { error: updateError } = await supabaseClient
                    .from('sellers')
                    .update({ coins: newCoins })
                    .eq('id', currentSeller.id);

                if (updateError) throw updateError;

                currentSeller.coins = newCoins;
                localStorage.setItem('current_seller', JSON.stringify(currentSeller));

                alert('পণ্যটি সফলভাবে আপলোড হয়েছে এবং ১ কয়েন কেটে নেওয়া হয়েছে!');
                window.location.href = 'seller_dashboard.html';

            } catch (err) {
                console.error(err);
                alert('আপলোড করতে সমস্যা হয়েছে: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-upload"></i> পণ্য আপলোড করুন (১ কয়েন কাটবে)';
            }
        }
    </script>
