<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাপোর্ট ও যোগাযোগ - TopTop BD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .support-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
            padding-bottom: 80px;
        }
        .support-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            text-align: center;
        }
        .support-card i {
            font-size: 35px;
            color: #ff5722;
            margin-bottom: 12px;
        }
        .support-card h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #222;
        }
        .support-card p {
            margin: 0;
            font-size: 14px;
            color: #555;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        textarea.form-control {
            resize: vertical;
            height: 90px;
        }
        .submit-btn {
            background: #ff5722;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        /* চ্যাট বক্স স্টাইল */
        .chat-box {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            display: none;
        }
        .chat-msg {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }
        .user-bubble {
            background: #e3f2fd;
            color: #0d47a1;
            margin-left: 20px;
        }
        .admin-bubble {
            background: #ffebee;
            color: #b71c1c;
            margin-right: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top" style="display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #ff5722; color: white;">
            <a href="index.html" style="color:white; text-decoration:none; font-size:16px;"><i class="fa-solid fa-arrow-left"></i></a>
            <h1 style="font-size: 18px; margin: 0;">সাপোর্ট ও চ্যাট</h1>
            <div style="width: 24px;"></div>
        </div>
    </header>

    <div class="support-container">
        
        <!-- টাইম কার্ড -->
        <div class="support-card">
            <i class="fa-regular fa-clock"></i>
            <h3>সাপোর্টের সময়সীমা</h3>
            <p>প্রতিদিন সকাল ১০:০০ টা থেকে রাত ১০:০০ টা পর্যন্ত আমরা আপনার সেবায় নিয়োজিত আছি।</p>
        </div>

        <!-- চ্যাট ও মেসেজ বক্স -->
        <div class="support-card" style="text-align: left;">
            <h3 style="margin-bottom: 15px; text-align: center; color: #ff5722;"><i class="fa-solid fa-headset"></i> কাস্টমার কেয়ার চ্যাট</h3>
            
            <!-- চ্যাট হিস্ট্রি দেখার সেকশন -->
            <div id="chatSection" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; background: #fff3e0; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 10px;">
                    <span>নম্বর: <strong id="activePhoneDisplay"></strong></span>
                    <button type="button" onclick="logoutChat()" style="background: none; border: none; color: #d32f2f; cursor: pointer; font-weight: bold; font-size: 12px;"><i class="fa-solid fa-right-from-bracket"></i> পরিবর্তন করুন</button>
                </div>
                
                <div id="chatContainer" class="chat-box">
                    <!-- মেসেজ এখানে লোড হবে -->
                </div>
                <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">
            </div>

            <!-- প্রথমবার আসার জন্য নম্বর ভেরিফিকেশন বা সার্চ বক্স -->
            <div id="loginSection">
                <div class="form-group">
                    <label>আপনার মোবাইল নম্বর দিয়ে চ্যাট শুরু করুন *</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="tel" id="verifyPhone" class="form-control" placeholder="যেমন: 01712345678">
                        <button type="button" onclick="verifyAndLoadChat()" style="background:#ff5722; color:#fff; border:none; padding:0 15px; border-radius:8px; cursor:pointer; font-weight:600;">প্রবেশ</button>
                    </div>
                </div>
                <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">
            </div>

            <!-- নতুন মেসেজ পাঠানোর ফর্ম (নম্বর অটো ফিল থাকবে) -->
            <form id="supportForm" onsubmit="submitSupportMessage(event)">
                <div class="form-group">
                    <label>আপনার নাম *</label>
                    <input type="text" id="supName" class="form-control" placeholder="আপনার নাম লিখুন" required>
                </div>
                <div class="form-group">
                    <label>মোবাইল নম্বর *</label>
                    <input type="tel" id="supPhone" class="form-control" placeholder="যেমন: 01712345678" readonly style="background: #f1f1f1; cursor: not-allowed;">
                    <small style="color: #666; font-size: 11px;">নম্বর পরিবর্তন করতে চাইলে ওপরের চ্যাট পরিবর্তন বাটনে ক্লিক করুন।</small>
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <label>আপনার বার্তা বা সমস্যা *</label>
                    <textarea id="supMsg" class="form-control" placeholder="আপনার বার্তা এখানে লিখুন..." required></textarea>
                </div>
                <button type="submit" id="supSubmitBtn" class="submit-btn">মেসেজ পাঠান</button>
            </form>
        </div>

    </div>

    <!-- নিচের নেভিগেশন বার -->
    <nav class="bottom-nav" style="position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #fff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 1000;">
        <a href="index.html" class="bottom-nav-item" style="display:flex; flex-direction:column; align-items:center; text-decoration:none; color:#777; font-size:11px;">
            <i class="fa-solid fa-house" style="font-size:18px; margin-bottom:3px;"></i>
            <span>হোম</span>
        </a>
        <a href="categories.html" class="bottom-nav-item" style="display:flex; flex-direction:column; align-items:center; text-decoration:none; color:#777; font-size:11px;">
            <i class="fa-solid fa-list" style="font-size:18px; margin-bottom:3px;"></i>
            <span>ক্যাটাগরি</span>
        </a>
        <a href="my_orders.html" class="bottom-nav-item" style="display:flex; flex-direction:column; align-items:center; text-decoration:none; color:#777; font-size:11px;">
            <i class="fa-solid fa-box-archive" style="font-size:18px; margin-bottom:3px;"></i>
            <span>আমার অর্ডার</span>
        </a>
        <a href="favorites.html" class="bottom-nav-item" style="display:flex; flex-direction:column; align-items:center; text-decoration:none; color:#777; font-size:11px;">
            <i class="fa-solid fa-heart" style="font-size:18px; margin-bottom:3px;"></i>
            <span>পছন্দ</span>
        </a>
        <a href="support.html" class="bottom-nav-item active" style="display:flex; flex-direction:column; align-items:center; text-decoration:none; color:#ff5722; font-size:11px;">
            <i class="fa-solid fa-headset" style="font-size:18px; margin-bottom:3px;"></i>
            <span>সাপোর্ট</span>
        </a>
    </nav>

    <script>
        const SUPABASE_URL = 'https://mzqqkkgdggwmpegvqaol.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16cXFra2dkZ2d3bXBlZ3ZxYW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDU4NDUsImV4cCI6MjEwMjM4MTg0NX0.hbUQ4dKjX2iXTF-ugi7JkV_-J5gKIpSEsPN8RpJ0EEo';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // পেজ লোড হলে চেক করা কাস্টমারের নম্বর আগে থেকেই সেভ আছে কি না
        window.onload = function() {
            let savedPhone = localStorage.getItem('toptop_support_phone');
            let savedName = localStorage.getItem('toptop_support_name');

            if (savedPhone) {
                document.getElementById('verifyPhone').value = savedPhone;
                verifyAndLoadChat();
            }
            if (savedName) {
                document.getElementById('supName').value = savedName;
            }
        };

        async function verifyAndLoadChat() {
            let phone = document.getElementById('verifyPhone').value.trim();
            if (!phone) {
                alert("দয়া করে আপনার মোবাইল নম্বরটি লিখুন।");
                return;
            }

            // ব্রাউজারে নম্বর সেভ করে রাখা
            localStorage.setItem('toptop_support_phone', phone);
            document.getElementById('supPhone').value = phone;
            document.getElementById('activePhoneDisplay').innerText = phone;

            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('chatSection').style.display = 'block';
            
            let chatContainer = document.getElementById('chatContainer');
            chatContainer.style.display = 'block';
            chatContainer.innerHTML = "লোড হচ্ছে...";

            const { data, error } = await supabaseClient
                .from('support_messages')
                .select('*')
                .eq('customer_phone', phone)
                .order('created_at', { ascending: true });

            if (error) {
                chatContainer.innerHTML = "ডেটা লোড করতে সমস্যা হয়েছে।";
                return;
            }

            if (data.length === 0) {
                chatContainer.innerHTML = "<p style='text-align:center; color:#777; font-size:13px;'>আপনার কোনো পূর্ববর্তী বার্তা নেই। নিচের ফর্ম থেকে মেসেজ পাঠান।</p>";
                return;
            }

            let html = '';
            data.forEach(item => {
                if(item.customer_name && !document.getElementById('supName').value) {
                    document.getElementById('supName').value = item.customer_name;
                    localStorage.setItem('toptop_support_name', item.customer_name);
                }
                html += `<div class="chat-msg user-bubble"><strong>${item.customer_name || 'আপনি'}:</strong> ${item.message}</div>`;
                if (item.admin_reply) {
                    html += `<div class="chat-msg admin-bubble"><strong>অ্যাডমিন (সাপোর্ট):</strong> ${item.admin_reply}</div>`;
                }
            });

            chatContainer.innerHTML = html;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // নম্বর পরিবর্তন বা লগআউট করার জন্য
        function logoutChat() {
            localStorage.removeItem('toptop_support_phone');
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('chatSection').style.display = 'none';
            document.getElementById('verifyPhone').value = '';
            document.getElementById('supPhone').value = '';
            document.getElementById('chatContainer').innerHTML = '';
        }

        // নতুন মেসেজ পাঠানোর ফাংশন
        async function submitSupportMessage(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('supSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "পাঠানো হচ্ছে...";

            let name = document.getElementById('supName').value.trim();
            let phone = document.getElementById('supPhone').value.trim();
            let message = document.getElementById('supMsg').value.trim();

            if (!phone) {
                alert("দয়া করে ওপরের বক্সে আপনার নম্বর দিয়ে প্রবেশ করুন।");
                submitBtn.disabled = false;
                submitBtn.innerText = "মেসেজ পাঠান";
                return;
            }

            localStorage.setItem('toptop_support_name', name);

            try {
                const { data, error } = await supabaseClient
                    .from('support_messages')
                    .insert([
                        {
                            customer_name: name,
                            customer_phone: phone,
                            message: message,
                            status: 'Unread'
                        }
                    ]);

                if (error) {
                    console.error(error);
                    alert("মেসেজ পাঠাতে সমস্যা হয়েছে: " + error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "মেসেজ পাঠান";
                    return;
                }

                alert("আপনার মেসেজটি সফলভাবে পাঠানো হয়েছে!");
                document.getElementById('supMsg').value = '';
                
                // চ্যাট বক্স সাথে সাথে রিফ্রেশ করা
                verifyAndLoadChat();

                submitBtn.disabled = false;
                submitBtn.innerText = "মেসেজ পাঠান";

            } catch (err) {
                console.error(err);
                alert("নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।");
                submitBtn.disabled = false;
                submitBtn.innerText = "মেসেজ পাঠান";
            }
        }
    </script>
</body>
</html>
