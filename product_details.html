<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোডাক্ট ডিটেইলস - TopTop BD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f7f7f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 90px;
        }
        .details-container {
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #ff5722;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }
        .product-title {
            font-size: 22px;
            font-weight: 700;
            color: #222;
            margin-bottom: 8px;
            line-height: 1.4;
            flex-grow: 1;
        }
        .btn-group-top {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .favorite-btn, .share-btn-top {
            background: #fff;
            border: 2px solid #eee;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #555;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .favorite-btn {
            color: #ccc;
        }
        .favorite-btn.active {
            color: #ff3b30;
            border-color: #ff3b30;
            background: #fff5f5;
        }
        .share-btn-top:hover {
            border-color: #ff5722;
            color: #ff5722;
            background: #fff8f6;
        }
        .product-price {
            font-size: 22px;
            font-weight: 700;
            color: #ff5722;
            margin-bottom: 15px;
        }
        .main-img-box {
            width: 100%;
            height: 320px;
            border-radius: 8px;
            overflow: hidden;
            background: #eee;
            margin-bottom: 12px;
        }
        .main-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sub-images-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .sub-img-thumb {
            width: 75px;
            height: 75px;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #ddd;
            cursor: pointer;
            background: #eee;
        }
        .sub-img-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sub-img-thumb.active {
            border-color: #ff5722;
        }
        .section-heading {
            font-size: 16px;
            font-weight: 600;
            color: #444;
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 15px;
            margin-bottom: 8px;
        }
        .product-description {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .related-section {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .related-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }
        
        .related-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .related-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .related-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .related-img-box {
            width: 100%;
            height: 140px;
            background: #f9f9f9;
            overflow: hidden;
        }
        .related-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .related-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }
        .related-product-name {
            font-size: 13px;
            font-weight: 600;
            color: #222;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
            height: 34px;
        }
        .related-product-price {
            font-size: 14px;
            font-weight: 700;
            color: #ff5722;
        }

        .action-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            padding: 10px 15px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-sizing: border-box;
            z-index: 999;
            max-width: 600px;
            left: 50%;
            transform: translateX(-50%);
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .chat-buttons-row {
            display: flex;
            gap: 10px;
        }
        .whatsapp-btn {
            background: #25D366;
            color: white;
            flex: 1;
        }
        .messenger-btn {
            background: #0084FF;
            color: white;
            flex: 1;
        }
        .order-btn {
            background: #ff5722;
            color: white;
            width: 100%;
        }

        /* Share Modal Styling */
        .share-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .share-modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .share-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 16px;
            color: #333;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #777;
        }
        .share-options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }
        .share-option-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            font-size: 12px;
            gap: 6px;
        }
        .share-icon-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        .share-fb { background: #1877F2; }
        .share-wa { background: #25D366; }
        .share-messenger { background: #0084FF; }
        .share-copy { background: #555; }
        .copy-link-box {
            display: flex;
            background: #f1f1f1;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        .copy-link-input {
            border: none;
            background: transparent;
            padding: 8px 10px;
            font-size: 12px;
            flex-grow: 1;
            color: #555;
            outline: none;
            width: 100%;
        }
        .copy-btn-action {
            background: #ff5722;
            color: white;
            border: none;
            padding: 0 12px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="details-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোম পেজে ফিরে যান</a>

        <div id="productDetailsContent">
            <p style="text-align: center; padding: 40px; color: #777;">লোড হচ্ছে...</p>
        </div>

        <div id="relatedProductsSection" class="related-section" style="display: none;">
            <div class="related-title">সংশ্লিষ্ট পণ্যসমূহ</div>
            <div id="relatedProductsGrid" class="related-grid"></div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="share-modal" id="shareModal">
        <div class="share-modal-content">
            <div class="share-modal-header">
                <span>প্রোডাক্টটি শেয়ার করুন</span>
                <button class="close-modal" onclick="closeShareModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="share-options-grid">
                <a href="#" id="shareFacebook" target="_blank" class="share-option-item">
                    <div class="share-icon-circle share-fb"><i class="fa-brands fa-facebook-f"></i></div>
                    <span>ফেসবুক</span>
                </a>
                <a href="#" id="shareWhatsapp" target="_blank" class="share-option-item">
                    <div class="share-icon-circle share-wa"><i class="fa-brands fa-whatsapp"></i></div>
                    <span>হোয়াটসঅ্যাপ</span>
                </a>
                <a href="#" id="shareMessenger" target="_blank" class="share-option-item">
                    <div class="share-icon-circle share-messenger"><i class="fa-brands fa-facebook-messenger"></i></div>
                    <span>মেসেঞ্জার</span>
                </a>
                <button onclick="copyProductLink()" class="share-option-item" style="background: none; border: none; cursor: pointer; width: 100%;">
                    <div class="share-icon-circle share-copy"><i class="fa-solid fa-copy"></i></div>
                    <span>কপি লিংক</span>
                </button>
            </div>
            <div class="copy-link-box">
                <input type="text" id="shareUrlInput" class="copy-link-input" readonly>
                <button class="copy-btn-action" onclick="copyProductLink()">কপি</button>
            </div>
        </div>
    </div>

    <div class="action-buttons" id="actionButtonsWrapper" style="display: none;">
        <div class="chat-buttons-row">
            <button onclick="sendToWhatsApp()" class="btn whatsapp-btn">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </button>
            <button onclick="sendToMessenger()" class="btn messenger-btn">
                <i class="fa-brands fa-facebook-messenger"></i> Messenger
            </button>
        </div>
        <button onclick="placeOrder()" class="btn order-btn">
            <i class="fa-solid fa-bag-shopping"></i> অর্ডার করুন
        </button>
    </div>

    <script>
        const SUPABASE_URL = 'https://mzqqkkgdggwmpegvqaol.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16cXFra2dkZ2d3bXBlZ3ZxYW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDU4NDUsImV4cCI6MjEwMjM4MTg0NX0.hbUQ4dKjX2iXTF-ugi7JkV_-J5gKIpSEsPN8RpJ0EEo';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentProduct = null;
        let selectedImageUrl = "";

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function fetchProductDetails() {
            const container = document.getElementById('productDetailsContent');
            const actionButtonsWrapper = document.getElementById('actionButtonsWrapper');

            if (!productId) {
                container.innerHTML = `<p style="color:red; text-align:center;">প্রোডাক্ট আইডি পাওয়া যায়নি!</p>`;
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .eq('id', productId)
                    .single();

                if (error || !data) {
                    container.innerHTML = `<p style="color:red; text-align:center;">প্রোডাক্ট ডাটা লোড করা যায়নি।</p>`;
                    return;
                }

                currentProduct = data;

                let images = [];
                if (data.image_url) images.push(data.image_url);
                if (data.image_url_1) images.push(data.image_url_1);
                if (data.image_url_2) images.push(data.image_url_2);

                if (images.length === 0) images.push('https://via.placeholder.com/300?text=No+Image');

                selectedImageUrl = images[0];

                container.innerHTML = `
                    <div class="title-row">
                        <h1 class="product-title">${data.name}</h1>
                        <div class="btn-group-top">
                            <button class="share-btn-top" onclick="openShareModal()" title="শেয়ার করুন">
                                <i class="fa-solid fa-share-nodes"></i>
                            </button>
                            <button class="favorite-btn" id="favBtn" onclick="toggleFavorite('${data.id}')">
                                <i class="fa-solid fa-heart"></i>
                            </button>
                        </div>
                    </div>
                    <div class="product-price">৳ ${data.price}</div>

                    <div class="main-img-box">
                        <img id="mainProductImg" src="${images[0]}" alt="${data.name}">
                    </div>

                    ${images.length > 1 ? `
                        <div class="sub-images-grid">
                            ${images.map((img, index) => `
                                <div class="sub-img-thumb ${index === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)">
                                    <img src="${img}" alt="Thumbnail">
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}

                    <div class="section-heading">পণ্যের বিবরণ</div>
                    <div class="product-description">${data.description || data.short_description || 'কোনো বিবরণ দেওয়া হয়নি।'}</div>
                `;

                actionButtonsWrapper.style.display = 'flex';
                checkFavoriteStatus();
                fetchRelatedProducts(data.category, data.id);
                setupShareLinks();

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color:red; text-align:center;">কানেকশন এরর হয়েছে!</p>`;
            }
        }

        function setupShareLinks() {
            const currentUrl = window.location.href;
            document.getElementById('shareUrlInput').value = currentUrl;
            
            const encodedUrl = encodeURIComponent(currentUrl);
            const encodedText = encodeURIComponent(currentProduct ? currentProduct.name : "TopTop BD Product");

            document.getElementById('shareFacebook').href = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;
            document.getElementById('shareWhatsapp').href = `https://api.whatsapp.com/send?text=${encodedText} - ${encodedUrl}`;
            document.getElementById('shareMessenger').href = `fb-messenger://share/?link=${encodedUrl}`;
        }

        function openShareModal() {
            document.getElementById('shareModal').style.display = 'flex';
        }

        function closeShareModal() {
            document.getElementById('shareModal').style.display = 'none';
        }

        function copyProductLink() {
            const urlInput = document.getElementById('shareUrlInput');
            urlInput.select();
            urlInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(urlInput.value).then(() => {
                alert("লিংক সফলভাবে কপি হয়েছে!");
                closeShareModal();
            });
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('shareModal');
            if (event.target == modal) {
                closeShareModal();
            }
        }

        async function fetchRelatedProducts(category, currentId) {
            const relatedSection = document.getElementById('relatedProductsSection');
            const relatedGrid = document.getElementById('relatedProductsGrid');

            try {
                let query = supabaseClient
                    .from('products')
                    .select('*')
                    .neq('id', currentId)
                    .limit(4);

                if (category) {
                    query = query.eq('category', category);
                }

                const { data, error } = await query;

                if (!error && data && data.length > 0) {
                    relatedGrid.innerHTML = data.map(item => `
                        <a href="product_details.html?id=${item.id}" class="related-card">
                            <div class="related-img-box">
                                <img src="${item.image_url || 'https://via.placeholder.com/150'}" alt="${item.name}" class="related-img">
                            </div>
                            <div class="related-info">
                                <div class="related-product-name">${item.name}</div>
                                <div class="related-product-price">৳ ${item.price}</div>
                            </div>
                        </a>
                    `).join('');
                    relatedSection.style.display = 'block';
                }
            } catch (err) {
                console.error('Related products error:', err);
            }
        }

        function toggleFavorite(id) {
            let favorites = JSON.parse(localStorage.getItem('topTopFavorites')) || [];
            const index = favorites.indexOf(id);
            const favBtn = document.getElementById('favBtn');

            if (index > -1) {
                favorites.splice(index, 1);
                favBtn.classList.remove('active');
            } else {
                favorites.push(id);
                favBtn.classList.add('active');
            }
            localStorage.setItem('topTopFavorites', JSON.stringify(favorites));
        }

        function checkFavoriteStatus() {
            if (!productId) return;
            let favorites = JSON.parse(localStorage.getItem('topTopFavorites')) || [];
            const favBtn = document.getElementById('favBtn');
            if (favorites.includes(productId)) {
                favBtn.classList.add('active');
            } else {
                favBtn.classList.remove('active');
            }
        }

        function changeMainImage(imgSrc, element) {
            document.getElementById('mainProductImg').src = imgSrc;
            selectedImageUrl = imgSrc;
            document.querySelectorAll('.sub-img-thumb').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        function sendToWhatsApp() {
            if (!currentProduct) return;
            let dbWhatsapp = currentProduct.whatsapp_link || "8801712345678";
            let phone = "8801712345678";

            if (dbWhatsapp.includes("wa.me/")) {
                phone = dbWhatsapp.split("wa.me/")[1].split("?")[0];
            } else {
                phone = dbWhatsapp.replace(/[^0-9]/g, '');
            }

            let message = `আসসালামু আলাইকুম, আমি এই প্রোডাক্টটি কিনতে চাই:\n\n` +
                          `📌 নাম: ${currentProduct.name}\n` +
                          `💰 দাম: ৳ ${currentProduct.price}\n` +
                          `🖼️ প্রোডাক্ট ছবি: ${selectedImageUrl}\n\n` +
                          `দয়া করে বিষয়টি কনফার্ম করুন।`;

            let encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
        }

        function sendToMessenger() {
            if (!currentProduct) return;
            let dbMessenger = currentProduct.messenger_link || "TopTopBD";
            let pageUsername = "TopTopBD";

            if (dbMessenger.includes("m.me/")) {
                pageUsername = dbMessenger.split("m.me/")[1].split("/")[0].split("?")[0];
            } else {
                pageUsername = dbMessenger;
            }

            let message = `আসসালামু আলাইকুম, আমি এই প্রোডাক্টটি কিনতে চাই:\n\n` +
                          `📌 নাম: ${currentProduct.name}\n` +
                          `💰 দাম: ৳ ${currentProduct.price}\n` +
                          `🖼️ প্রোডাক্ট ছবি: ${selectedImageUrl}\n\n` +
                          `দয়া করে বিষয়টি কনফার্ম করুন।`;

            navigator.clipboard.writeText(message).then(() => {
                alert("প্রোডাক্টের বিবরণ কপি করা হয়েছে! মেসেঞ্জার ওপেন হলে সেখানে পেস্ট (Paste) করে দিন।");
            });

            window.open(`https://m.me/${pageUsername}`, '_blank');
        }

        function placeOrder() {
            if (!currentProduct) return;
            window.location.href = `checkout.html?id=${currentProduct.id}`;
        }

        window.onload = fetchProductDetails;
    </script>
</body>
</html>
